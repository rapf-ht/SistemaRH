<!-- Container flexível centralizado vertical e horizontalmente (Etapa 9 - Atividade Extra) -->
<div class="flex items-center justify-center min-h-[calc(100vh-8rem)] px-4">
  <!-- Cartão centralizado com largura máxima limitada (max-w-md = 28rem), padding interno p-6, bordas arredondadas e sombra -->
  <div class="w-full max-w-md bg-white p-6 rounded-lg shadow border border-slate-200">
    <!-- Título de identificação do sistema e cabeçalho da view -->
    <div class="mb-6 text-center">
      <h1 class="text-2xl font-bold text-slate-900">SistemaRH</h1>
      <p class="text-sm text-slate-600 mt-1">Acesso ao Sistema — Login</p>
    </div>

    <!-- Formulário visual empilhado em coluna única com espaçamento vertical uniforme (space-y-4) -->
    <form class="space-y-4">
      <!-- Campo de e-mail com label vinculado por atributo for/id e validação semântica nativa type="email" -->
      <div>
        <label for="login-email" class="block text-sm font-medium text-slate-700 mb-1">
          E-mail
        </label>
        <input
          id="login-email"
          type="email"
          placeholder="usuario@empresa.com.br"
          class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent"
        />
      </div>

      <!-- Campo de senha mascarado no DOM via type="password" com estado de foco explícito -->
      <div>
        <label for="login-senha" class="block text-sm font-medium text-slate-700 mb-1">
          Senha
        </label>
        <input
          id="login-senha"
          type="password"
          placeholder="••••••••"
          class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent"
        />
      </div>

      <!-- type="button" bloqueia o disparo do evento submit nativo do form, mantendo ação puramente visual nesta etapa -->
      <button
        type="button"
        class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium py-2.5 px-4 rounded-md transition-colors focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2 cursor-pointer"
      >
        Entrar
      </button>
    </form>

    <!-- Link de transição de rota via diretiva routerLink apontando para /cadastro sem recarregar a árvore DOM -->
    <div class="mt-6 text-center text-sm text-slate-600">
      <a routerLink="/cadastro" class="text-blue-600 hover:text-blue-800 hover:underline font-medium">
        Não possui uma conta? Cadastre-se
      </a>
    </div>
  </div>
</div>
